<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾光記帳 V1.9.8 發布版本檢查</title><style>body{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:#f6f7fc;color:#263352;max-width:650px;margin:8vh auto;padding:20px}main{padding:24px;background:#fff;border-radius:20px;box-shadow:0 15px 50px #21325a13}b{color:#675add}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f5fa;padding:12px;border-radius:10px}button,a{font-size:16px;display:inline-block;padding:11px 15px;background:#6b5de5;color:white;border-radius:9px;border:0;text-decoration:none;margin-right:8px;margin-bottom:8px}</style></head><body><main><h1>拾光記帳 · 發布版本檢查</h1><p>這是一個<b>獨立檢查頁</b>，不會讀取、修改或刪除記帳資料。</p><p>此檢查頁原始碼版本：<b>V1.9.8</b></p><p id="result">正在讀取 GitHub 線上 version.json…</p><pre id="detail"></pre><button type="button" id="retry">重新檢查</button><a href="./index.html">返回記帳系統</a><p>如果開啟本頁卻顯示 404，代表檔案尚未放到 GitHub Pages 正確的發布目錄。</p></main><script>async function run(){const s=document.getElementById('result'),d=document.getElementById('detail');try{const u=new URL('./version.json',location.href);u.searchParams.set('_',Date.now());const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();s.textContent='GitHub Pages 已發布版本：'+(j.version||'未知');d.textContent=JSON.stringify(j,null,2)}catch(e){s.textContent='版本檢查失敗：'+e.message;d.textContent='請確認 index.html 與 version.json 直接位於 Pages 發布根目錄。'}}document.getElementById('retry').addEventListener('click',run);run()</script></body></html>
